name: test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tinygo-org/tinygo-dev
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: TinyGo version check
        run: tinygo version
      - name: Add required GOFLAGS
        run: go env -w GOFLAGS=-buildvcs=false
      - name: Run unit tests
        run: make test
      - name: Run TinyGo smoke tests
        run: make smoketest
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: web/go.mod
          cache-dependency-path: web/go.sum
      - name: Test and build the web site
        run: make -C web test build
